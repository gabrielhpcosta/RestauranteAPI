services:

  postgres:
    image: postgres:16
    container_name: restaurante-postgres
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - restaurante_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  restaurante_postgres_data: