# Perfil usado pelos testes (@ActiveProfiles("test")).
# Sobrescreve só o que muda em relação ao application.properties principal.

# H2 em memória no modo PostgreSQL: o banco nasce e morre junto com o teste
spring.datasource.url=jdbc:h2:mem:restaurante;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# segredo só para os testes (precisa ter pelo menos 32 caracteres para o HMAC-SHA256)
api.security.token.secret=segredo-dos-testes-com-pelo-menos-32-caracteres
